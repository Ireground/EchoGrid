name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload EchoGrid.vst3
        uses: actions/upload-artifact@v4
        with:
          name: EchoGrid-VST3-Windows
          path: build/EchoGrid_artefacts/Release/VST3/*.vst3
